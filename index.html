<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development</title>
    <link rel="stylesheet"  type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-card title-card">
            <div class="title-content">
                <h1>LANDING PAGE</h1>
                <p class="subtitle">This is a google form created with HTML and CSS</p>
                <p class="required-note">* Indicates required question</p>
            </div>
        </div>
        
        <form action="#" method="post">
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Full Name<span class="required-star"> *</span></label>
                    <input type="text" class="form-input" name="name" placeholder="Your answer" required>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Contact Number<span class="required-star"> *</span></label>
                    <input type="tel" class="form-input" name="phone" pattern="[1-9]{1}[0-9]{9}" maxlength="10" placeholder="123456789" required>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Address<span class="required-star"> *</span></label>
                    <textarea class="form-input" name="textarea" placeholder="Your answer" required></textarea>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Company Name<span class="required-star"> *</span></label>
                    <input type="text" class="form-input" name="answer" placeholder="Your answer" required>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Email<span class="required-star"> *</span></label>
                    <input type="email" class="form-input" name="email" placeholder="Your answer" required>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Department<span class="required-star"> *</span></label>
                    <select class="form-input" name="Department" required>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Development">Development</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
            </div>
            
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">Gender<span class="required-star"> *</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="gender" value="Male" required> Male
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="Female"> Female
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="no"> Prefer not to say
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <input type="submit" class="btn" value="Submit">
                <input type="reset" class="btn" value="Clear Form">
            </div>
        </form>
        
        <div class="footer">
            <p class="warning">Never submit passwords through Google Forms.</p>
            <p class="disclaimer">This content is neither created nor endorsed by Google. - <a href="#" class="footer-link"><u>Terms of Service</u></a> - <a href="#" class="footer-link"><u>Private Policy</u></a>.</p>
            <p class="report">Does this form look suspicious? <a href="#" class="footer-link"><u>Report</u></a></p>
            <h2 class="branding"><span class="google">Google</span> Forms</h2>
        </div>
    </div>
</body>
</html>
